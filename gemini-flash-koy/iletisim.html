<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İletişim | Palabıyık Köyü</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container py-5">
        <h2 class="text-center mb-5">İletişim</h2>
        <div class="row g-5">
            <div class="col-md-6">
                <form class="bg-white p-4 rounded shadow-sm">
                    <div class="mb-3"><label>Ad Soyad</label><input type="text" class="form-control"></div>
                    <div class="mb-3"><label>E-Posta</label><input type="email" class="form-control"></div>
                    <div class="mb-3"><label>Mesajınız</label><textarea class="form-control" rows="5"></textarea></div>
                    <button type="submit" class="btn btn-success w-100">Gönder</button>
                </form>
            </div>
            <div class="col-md-6">
                <div id="map-container">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12170.826543169727!2d34.90828555!3d40.4153949!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x408103c1e284f331%3A0x892a7e78d2274488!2sPalab%C4%B1y%C4%B1k%2C%2019000%20Palab%C4%B1y%C4%B1k%2F%C3%87orum%20Merkez%2F%C3%87orum!5e0!3m2!1str!2str!4v1700000000000!5m2!1str!2str" loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </div>
