<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim | ATK Koleji</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --blue: #1e3a8a; --light: #f8fafc; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--light); padding: 3rem 5%; }
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; margin-top: 2rem; }
        .contact-info div { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
        .contact-info i { font-size: 1.5rem; color: var(--blue); }
        .map-box { background: #e2e8f0; height: 400px; border-radius: 1rem; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <h1>📞 Bize Ulaşın</h1>
    <div class="contact-grid">
        <div class="contact-info">
            <div><i class="bi bi-geo-alt-fill"></i><div><h4>Adres</h4><p>Teknoloji Vadisi No:1, 34000 İstanbul/Türkiye</p></div></div>
            <div><i class="bi bi-telephone-fill"></i><div><h4>Telefon</h4><p>+90 212 000 00 00</p></div></div>
            <div><i class="bi bi-envelope-at-fill"></i><div><h4>E-Posta</h4><p>info@atc.k12.tr</p></div></div>
            <div class="socials" style="gap:1rem;">
                <i class="bi bi-instagram"></i><i class="bi bi-twitter-x"></i><i class="bi bi-facebook"></i><i class="bi bi-youtube"></i>
            </div>
        </div>
        <div class="map-box">
            <p><i class="bi bi-map"></i> İnteraktif Harita Yükleniyor...</p>
        </div>
    </div>
</body>
</html>
