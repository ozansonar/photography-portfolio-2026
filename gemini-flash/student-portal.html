<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Paneli | ATK Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --sidebar: #0f172a; --content: #f8fafc; --accent: #3b82f6; }
        body { margin: 0; display: flex; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--content); }
        .sidebar { width: 280px; background: var(--sidebar); height: 100vh; color: white; padding: 2rem 1rem; position: fixed; }
        .main { margin-left: 280px; padding: 3rem; width: 100%; }
        .nav-item { padding: 1rem; display: flex; align-items: center; gap: 1rem; color: #94a3b8; text-decoration: none; border-radius: 8px; margin-bottom: 0.5rem; }
        .nav-item.active { background: var(--accent); color: white; }
        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 2rem; }
        .card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .grade-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .grade-table th, .grade-table td { padding: 1rem; border-bottom: 1px solid #e2e8f0; text-align: left; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>ÖĞRENCİ PORTALI</h3>
        <p style="color: #64748b; font-size: 0.8rem; margin-bottom: 2rem;">Hoş geldin, Ozan Sonar</p>
        <a href="#" class="nav-item active"><i class="bi bi-grid-1x2-fill"></i> Panel</a>
        <a href="#" class="nav-item"><i class="bi bi-journal-text"></i> Ders Notları</a>
        <a href="#" class="nav-item"><i class="bi bi-calendar-event"></i> Ders Programı</a>
        <a href="#" class="nav-item"><i class="bi bi-pencil-square"></i> Ödevler</a>
        <a href="#" class="nav-item"><i class="bi bi-megaphone"></i> Duyurular</a>
        <a href="index.html" class="nav-item" style="margin-top: auto;"><i class="bi bi-box-arrow-left"></i> Çıkış Yap</a>
    </div>
    <div class="main">
        <h2>Genel Bakış</h2>
        <div class="card-grid">
            <div class="card"><h4>Genel Ortalama</h4><p style="font-size: 2rem; font-weight: 800; color: var(--accent);">92.40</p></div>
            <div class="card"><h4>Devamsızlık</h4><p style="font-size: 2rem; font-weight: 800; color: #f59e0b;">2.5 Gün</p></div>
            <div class="card"><h4>Bekleyen Ödev</h4><p style="font-size: 2rem; font-weight: 800; color: #ef4444;">4 Adet</p></div>
        </div>
        <div class="card" style="margin-top: 2rem;">
            <h3>Son Sınav Sonuçları</h3>
            <table class="grade-table">
                <thead><tr><th>Ders Adı</th><th>Sınav 1</th><th>Sınav 2</th><th>Sözlü</th><th>Ortalama</th></tr></thead>
                <tbody>
                    <tr><td>Matematik</td><td>95</td><td>88</td><td>100</td><td>94.3</td></tr>
                    <tr><td>Fizik</td><td>85</td><td>92</td><td>95</td><td>90.6</td></tr>
                    <tr><td>İngilizce</td><td>100</td><td>98</td><td>100</td><td>99.3</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
