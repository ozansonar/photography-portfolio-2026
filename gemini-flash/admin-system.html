<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ATK SIS | Yönetim Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --p: #1e3a8a; --s: #64748b; }
        .sidebar { height: 100vh; background: var(--p); color: white; position: fixed; width: 260px; padding: 20px; }
        .main { margin-left: 260px; padding: 40px; background: #f1f5f9; min-height: 100vh; }
        .data-card { background: white; border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h4>ATK | SIS v1.0</h4>
        <hr>
        <nav class="nav flex-column">
            <a class="nav-link text-white" href="#"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a class="nav-link text-white" href="#" onclick="showSection('reg')"><i class="bi bi-person-plus me-2"></i> Kayıt Yönetimi</a>
            <a class="nav-link text-white" href="#" onclick="showSection('grades')"><i class="bi bi-journal-check me-2"></i> Not Girişi</a>
        </nav>
    </div>
    <div class="main">
        <div id="dashboard-view">
            <h2 class="mb-4">Sistem Durumu</h2>
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card data-card p-4">
                        <h6>Toplam Kayıt</h6>
                        <h2 id="count-total">0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card data-card p-4">
                        <h6>Onay Bekleyen</h6>
                        <h2 class="text-warning" id="count-pending">0</h2>
                    </div>
                </div>
            </div>
            
            <div class="card data-card mt-4 p-4">
                <h5>Hızlı Kayıt (System Testing)</h5>
                <form id="regForm" class="row g-3">
                    <div class="col-md-6"><input type="text" id="name" class="form-control" placeholder="Öğrenci Adı" required></div>
                    <div class="col-md-6"><input type="email" id="email" class="form-control" placeholder="E-posta" required></div>
                    <div class="col-button"><button type="submit" class="btn btn-primary">Sisteme İşle</button></div>
                </form>
            </div>
        </div>
    </div>

    <script src="system/core.js"></script>
    <script>
        document.getElementById('regForm').onsubmit = (e) => {
            e.preventDefault();
            const id = SIS.registerStudent({
                name: document.getElementById('name').value,
                email: document.getElementById('email').value
            });
            alert('Sistem Kaydı Başarılı! Atanan ID: ' + id);
            location.reload();
        };

        // Update Dashboard Stats
        document.getElementById('count-total').innerText = SIS.students.length;
        document.getElementById('count-pending').innerText = SIS.students.filter(s => s.status === 'Pending').length;
    </script>
</body>
</html>
