<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Öğrenci Kayıt | Bootstrap 5.3 Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #030712; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-form {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 3rem;
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 12px;
            padding: 12px;
        }
        .form-control:focus { background: rgba(255, 255, 255, 0.1); color: #fff; border-color: #4f46e5; box-shadow: none; }
        .label-custom { font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
    </style>
</head>
<body class="py-5">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="glass-form">
                    <div class="text-center mb-5">
                        <i class="bi bi-person-plus-fill text-primary display-4"></i>
                        <h2 class="mt-3 fw-bold">2026 Ön Kayıt Sistemi</h2>
                        <p class="text-secondary">Geleceğinize ilk adımı atın.</p>
                    </div>
                    <form class="row g-4">
                        <div class="col-md-6">
                            <label class="label-custom">Öğrenci Adı</label>
                            <input type="text" class="form-control" placeholder="Örn: Ozan">
                        </div>
                        <div class="col-md-6">
                            <label class="label-custom">Öğrenci Soyadı</label>
                            <input type="text" class="form-control" placeholder="Örn: Sonar">
                        </div>
                        <div class="col-md-12">
                            <label class="label-custom">T.C. Kimlik No</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="label-custom">Sınıf Seviyesi</label>
                            <select class="form-select">
                                <option>İlkokul</option>
                                <option>Ortaokul</option>
                                <option>Lise (Fen)</option>
                                <option>Lise (Anadolu)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="label-custom">Veli Telefon No</label>
                            <input type="tel" class="form-control" placeholder="+90">
                        </div>
                        <div class="col-12 mt-5">
                            <button type="button" class="btn btn-primary w-100 py-3 fw-bold rounded-4 shadow" onclick="alert('Kayıt işleminiz başlatıldı. Evraklarınız incelendikten sonra tarafınıza dönüş sağlanacaktır.')">Başvuruyu Gönder</button>
                        </div>
                    </form>
                    <div class="text-center mt-4">
                        <a href="index.html" class="text-secondary text-decoration-none small"><i class="bi bi-arrow-left"></i> Geri Dön</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
