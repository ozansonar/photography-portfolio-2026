<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Kayıt Sistemi | ATK Koleji</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --blue: #1e3a8a; --light: #f1f5f9; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--light); padding: 4rem 1rem; }
        .registration-form { max-width: 800px; margin: 0 auto; background: white; padding: 3rem; border-radius: 1.5rem; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .form-section { margin-bottom: 2rem; }
        .form-section h3 { margin-bottom: 1rem; color: var(--blue); border-bottom: 2px solid var(--light); padding-bottom: 0.5rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        input, select { width: 100%; padding: 0.8rem; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 0.5rem; }
        button { background: var(--blue); color: white; border: none; padding: 1rem 2rem; border-radius: 8px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="registration-form">
        <h2 style="text-align: center; margin-bottom: 2rem;">2026-2027 Ön Kayıt Formu</h2>
        <div class="form-section">
            <h3>Öğrenci Bilgileri</h3>
            <div class="grid">
                <div><label>Adı</label><input type="text"></div>
                <div><label>Soyadı</label><input type="text"></div>
                <div><label>T.C. Kimlik No</label><input type="text"></div>
                <div><label>Kayıt Olmak İstediği Sınıf</label>
                    <select>
                        <option>İlkokul (1-4)</option>
                        <option>Ortaokul (5-8)</option>
                        <option>Fen Lisesi</option>
                        <option>Anadolu Lisesi</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="form-section">
            <h3>Veli Bilgileri</h3>
            <div class="grid">
                <div><label>Veli Ad Soyad</label><input type="text"></div>
                <div><label>Telefon</label><input type="tel"></div>
                <div><label>E-Posta</label><input type="email"></div>
                <div><label>Yakınlık Derecesi</label><input type="text"></div>
            </div>
        </div>
        <button onclick="alert('Ön kaydınız başarıyla alınmıştır. İlgili birimimiz en kısa sürede sizinle iletişime geçecektir.')">Başvuruyu Tamamla</button>
        <p style="text-align:center; margin-top:1.5rem;"><a href="index.html" style="color:var(--blue); text-decoration:none;">Anasayfaya Dön</a></p>
    </div>
</body>
</html>
