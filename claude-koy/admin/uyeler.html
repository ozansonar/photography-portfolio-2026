<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Üyeler - Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css" rel="stylesheet">
  <link href="css/admin-modern.css" rel="stylesheet">
  <link href="css/datatable-custom.css" rel="stylesheet">
</head>
<body>
  <aside class="modern-sidebar">
    <div class="sidebar-brand"><div class="brand-icon"><i class="fas fa-mountain"></i></div><div class="brand-text"><h3>Palabıyık</h3><p>Admin Panel</p></div></div>
    <nav class="sidebar-menu">
      <a href="dashboard.html" class="menu-item"><div class="menu-icon"><i class="fas fa-chart-line"></i></div><span>Dashboard</span></a>
      <a href="haberler.html" class="menu-item"><div class="menu-icon"><i class="fas fa-newspaper"></i></div><span>Haberler</span><span class="badge badge-primary">127</span></a>
      <a href="etkinlikler.html" class="menu-item"><div class="menu-icon"><i class="fas fa-calendar-alt"></i></div><span>Etkinlikler</span><span class="badge badge-success">48</span></a>
      <a href="esnaflar.html" class="menu-item"><div class="menu-icon"><i class="fas fa-store"></i></div><span>Esnaflar</span><span class="badge badge-warning">24</span></a>
      <a href="galeri.html" class="menu-item"><div class="menu-icon"><i class="fas fa-images"></i></div><span>Galeri</span></a>
      <a href="uyeler.html" class="menu-item active"><div class="menu-icon"><i class="fas fa-users"></i></div><span>Üyeler</span><span class="badge badge-info">450</span></a>
      <a href="ayarlar.html" class="menu-item"><div class="menu-icon"><i class="fas fa-cog"></i></div><span>Ayarlar</span></a>
    </nav>
    <div class="sidebar-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=100&q=80" alt="Admin"><div class="user-info"><strong>Admin</strong><small>Yönetici</small></div><button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button></div>
  </aside>

  <main class="main-wrapper">
    <header class="top-bar">
      <div class="page-title"><h1>Dernek Üyeleri</h1><p>Üye bilgilerini yönetin</p></div>
      <div class="top-bar-actions">
        <button class="btn btn-secondary"><i class="fas fa-download me-2"></i>Dışa Aktar</button>
        <button class="btn btn-primary modern-btn"><i class="fas fa-user-plus me-2"></i>Yeni Üye Ekle</button>
      </div>
    </header>

    <div class="content-wrapper">
      <div class="row g-4 mb-4">
        <div class="col-md-3"><div class="stat-card stat-card-info"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-content"><h3 class="stat-number" data-target="450">0</h3><p class="stat-label">Toplam Üye</p></div></div></div>
        <div class="col-md-3"><div class="stat-card stat-card-success"><div class="stat-icon"><i class="fas fa-user-check"></i></div><div class="stat-content"><h3 class="stat-number" data-target="425">0</h3><p class="stat-label">Aktif Üye</p></div></div></div>
        <div class="col-md-3"><div class="stat-card stat-card-warning"><div class="stat-icon"><i class="fas fa-user-plus"></i></div><div class="stat-content"><h3 class="stat-number" data-target="15">0</h3><p class="stat-label">Bu Ay Yeni</p></div></div></div>
        <div class="col-md-3"><div class="stat-card stat-card-primary"><div class="stat-icon"><i class="fas fa-calendar-check"></i></div><div class="stat-content"><h3 class="stat-number" data-target="92">0</h3><p class="stat-label">Bu Yıl</p></div></div></div>
      </div>

      <div class="glass-card">
        <div class="card-header"><h4><i class="fas fa-list me-2"></i>Tüm Üyeler</h4></div>
        <div class="card-body">
          <table id="membersTable" class="table table-hover" style="width:100%">
            <thead>
              <tr>
                <th>Ad Soyad</th>
                <th>E-posta</th>
                <th>Telefon</th>
                <th>Üyelik Tarihi</th>
                <th>Üyelik Tipi</th>
                <th>Durum</th>
                <th width="120">İşlemler</th>
              </tr>
            </thead>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/datatables/members-datatable.js"></script>
</body>
</html>
