<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayarlar - Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="css/admin-modern.css" rel="stylesheet">
</head>
<body>
  <aside class="modern-sidebar">
    <div class="sidebar-brand"><div class="brand-icon"><i class="fas fa-mountain"></i></div><div class="brand-text"><h3>Palabıyık</h3><p>Admin Panel</p></div></div>
    <nav class="sidebar-menu">
      <a href="dashboard.html" class="menu-item"><div class="menu-icon"><i class="fas fa-chart-line"></i></div><span>Dashboard</span></a>
      <a href="haberler.html" class="menu-item"><div class="menu-icon"><i class="fas fa-newspaper"></i></div><span>Haberler</span><span class="badge badge-primary">12</span></a>
      <a href="etkinlikler.html" class="menu-item"><div class="menu-icon"><i class="fas fa-calendar-alt"></i></div><span>Etkinlikler</span><span class="badge badge-success">8</span></a>
      <a href="esnaflar.html" class="menu-item"><div class="menu-icon"><i class="fas fa-store"></i></div><span>Esnaflar</span><span class="badge badge-warning">24</span></a>
      <a href="galeri.html" class="menu-item"><div class="menu-icon"><i class="fas fa-images"></i></div><span>Galeri</span></a>
      <a href="uyeler.html" class="menu-item"><div class="menu-icon"><i class="fas fa-users"></i></div><span>Üyeler</span><span class="badge badge-info">450</span></a>
      <a href="ayarlar.html" class="menu-item active"><div class="menu-icon"><i class="fas fa-cog"></i></div><span>Ayarlar</span></a>
    </nav>
    <div class="sidebar-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=100&q=80" alt="Admin"><div class="user-info"><strong>Admin</strong><small>Yönetici</small></div><button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button></div>
  </aside>

  <main class="main-wrapper">
    <header class="top-bar">
      <div class="page-title"><h1>Ayarlar</h1><p>Site ayarlarını yönetin</p></div>
      <div class="top-bar-actions"><button class="btn btn-primary modern-btn"><i class="fas fa-save me-2"></i>Değişiklikleri Kaydet</button></div>
    </header>

    <div class="content-wrapper">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="glass-card mb-4">
            <div class="card-header"><h4><i class="fas fa-globe me-2"></i>Genel Ayarlar</h4></div>
            <div class="card-body">
              <div class="mb-3"><label class="form-label fw-bold">Site Başlığı</label><input type="text" class="form-control" value="Palabıyık Köyü"></div>
              <div class="mb-3"><label class="form-label fw-bold">Site Açıklaması</label><textarea class="form-control" rows="3">Çorum'un doğal güzellikleri ve zengin kültürüyle öne çıkan köyümüz.</textarea></div>
              <div class="mb-3"><label class="form-label fw-bold">Anahtar Kelimeler</label><input type="text" class="form-control" value="palabıyık, köy, çorum, turizm, doğa"></div>
            </div>
          </div>

          <div class="glass-card mb-4">
            <div class="card-header"><h4><i class="fas fa-envelope me-2"></i>İletişim Bilgileri</h4></div>
            <div class="card-body">
              <div class="mb-3"><label class="form-label fw-bold">E-posta</label><input type="email" class="form-control" value="info@palabiyik.com"></div>
              <div class="mb-3"><label class="form-label fw-bold">Telefon</label><input type="tel" class="form-control" value="+90 555 123 4567"></div>
              <div class="mb-3"><label class="form-label fw-bold">Adres</label><textarea class="form-control" rows="2">Palabıyık Köyü, Çorum</textarea></div>
            </div>
          </div>

          <div class="glass-card">
            <div class="card-header"><h4><i class="fas fa-share-alt me-2"></i>Sosyal Medya</h4></div>
            <div class="card-body">
              <div class="mb-3"><label class="form-label"><i class="fab fa-facebook me-2"></i>Facebook</label><input type="url" class="form-control" placeholder="https://facebook.com/..."></div>
              <div class="mb-3"><label class="form-label"><i class="fab fa-instagram me-2"></i>Instagram</label><input type="url" class="form-control" placeholder="https://instagram.com/..."></div>
              <div class="mb-3"><label class="form-label"><i class="fab fa-twitter me-2"></i>Twitter</label><input type="url" class="form-control" placeholder="https://twitter.com/..."></div>
              <div class="mb-3"><label class="form-label"><i class="fab fa-youtube me-2"></i>YouTube</label><input type="url" class="form-control" placeholder="https://youtube.com/..."></div>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="glass-card mb-4">
            <div class="card-header"><h4><i class="fas fa-image me-2"></i>Logo</h4></div>
            <div class="card-body text-center">
              <div style="width: 120px; height: 120px; background: var(--gradient-primary); border-radius: 20px; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: white;">
                <i class="fas fa-mountain"></i>
              </div>
              <input type="file" class="form-control" accept="image/*">
            </div>
          </div>

          <div class="glass-card mb-4">
            <div class="card-header"><h4><i class="fas fa-paint-brush me-2"></i>Tema Renkleri</h4></div>
            <div class="card-body">
              <div class="mb-3"><label class="form-label">Ana Renk</label><input type="color" class="form-control" value="#6366f1"></div>
              <div class="mb-3"><label class="form-label">Vurgu Rengi</label><input type="color" class="form-control" value="#8b5cf6"></div>
            </div>
          </div>

          <div class="glass-card">
            <div class="card-header"><h4><i class="fas fa-shield-alt me-2"></i>Güvenlik</h4></div>
            <div class="card-body">
              <button class="btn btn-outline-primary w-100 mb-2"><i class="fas fa-key me-2"></i>Şifre Değiştir</button>
              <button class="btn btn-outline-warning w-100 mb-2"><i class="fas fa-history me-2"></i>Yedek Al</button>
              <button class="btn btn-outline-danger w-100"><i class="fas fa-trash me-2"></i>Önbelleği Temizle</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin-common.js"></script>
</body>
</html>
