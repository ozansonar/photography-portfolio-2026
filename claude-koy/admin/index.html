<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş - Admin Panel | Palabıyık Köyü</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="css/admin-modern.css" rel="stylesheet">
</head>
<body class="login-body">

  <!-- Animated Background -->
  <div class="animated-bg">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
  </div>

  <!-- Login Container -->
  <div class="login-wrapper">
    <div class="login-glass-card">
      <div class="login-header">
        <div class="logo-container">
          <i class="fas fa-mountain"></i>
        </div>
        <h1>Palabıyık Köyü</h1>
        <p>Yönetim Paneli</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-floating mb-3">
          <input type="text" class="form-control modern-input" id="username" placeholder="Kullanıcı Adı" required>
          <label for="username"><i class="fas fa-user me-2"></i>Kullanıcı Adı</label>
        </div>

        <div class="form-floating mb-3">
          <input type="password" class="form-control modern-input" id="password" placeholder="Şifre" required>
          <label for="password"><i class="fas fa-lock me-2"></i>Şifre</label>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">
              Beni Hatırla
            </label>
          </div>
          <a href="#" class="forgot-link">Şifremi Unuttum?</a>
        </div>

        <button type="submit" class="btn btn-primary modern-btn w-100">
          <span>Giriş Yap</span>
          <i class="fas fa-arrow-right ms-2"></i>
        </button>
      </form>

      <div class="login-footer">
        <p class="demo-info">
          <i class="fas fa-info-circle me-2"></i>
          Demo: <strong>admin</strong> / <strong>admin123</strong>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (username === 'admin' && password === 'admin123') {
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'dashboard.html';
      } else {
        alert('❌ Hatalı kullanıcı adı veya şifre!');
      }
    });
  </script>
</body>
</html>
