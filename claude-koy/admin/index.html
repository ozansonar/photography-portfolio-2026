<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Palabıyık Köyü</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen" class="login-screen">
    <div class="login-container">
      <div class="login-header">
        <i class="fas fa-mountain"></i>
        <h2>Palabıyık Köyü</h2>
        <p>Yönetim Paneli</p>
      </div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-user me-2"></i>Kullanıcı Adı</label>
          <input type="text" class="form-control" id="username" placeholder="admin" required>
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-lock me-2"></i>Şifre</label>
          <input type="password" class="form-control" id="password" placeholder="••••••" required>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Beni Hatırla</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="fas fa-sign-in-alt me-2"></i>Giriş Yap
        </button>
      </form>
      <div class="login-footer">
        <p class="text-muted small mt-3 mb-0">Demo: admin / admin123</p>
      </div>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" class="admin-panel" style="display: none;">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fas fa-mountain"></i>
        <h3>Palabıyık Köyü</h3>
        <p>Yönetim Paneli</p>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard">
          <i class="fas fa-chart-line"></i>
          <span>Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-page="news">
          <i class="fas fa-newspaper"></i>
          <span>Haberler</span>
          <span class="badge">12</span>
        </a>
        <a href="#" class="nav-item" data-page="events">
          <i class="fas fa-calendar-alt"></i>
          <span>Etkinlikler</span>
          <span class="badge">8</span>
        </a>
        <a href="#" class="nav-item" data-page="businesses">
          <i class="fas fa-store"></i>
          <span>Esnaflar</span>
          <span class="badge">24</span>
        </a>
        <a href="#" class="nav-item" data-page="gallery">
          <i class="fas fa-images"></i>
          <span>Galeri</span>
        </a>
        <a href="#" class="nav-item" data-page="members">
          <i class="fas fa-users"></i>
          <span>Üyeler</span>
          <span class="badge">450</span>
        </a>
        <a href="#" class="nav-item" data-page="settings">
          <i class="fas fa-cog"></i>
          <span>Ayarlar</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=100&q=80" alt="Admin">
          <div>
            <strong>Admin</strong>
            <small>Yönetici</small>
          </div>
        </div>
        <button class="btn btn-sm btn-outline-light" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      
      <!-- Header -->
      <header class="content-header">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p class="text-muted" id="pageSubtitle">Hoş geldiniz, Admin</p>
        </div>
        <div class="header-actions">
          <button class="btn btn-icon" title="Bildirimler">
            <i class="fas fa-bell"></i>
            <span class="notification-badge">3</span>
          </button>
          <button class="btn btn-icon" title="Mesajlar">
            <i class="fas fa-envelope"></i>
          </button>
          <button class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Yeni Ekle
          </button>
        </div>
      </header>

      <!-- Content Area -->
      <div id="contentArea" class="content-area"></div>

    </main>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
