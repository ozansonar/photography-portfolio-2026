<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haberler - Admin Panel | Palabıyık Köyü</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <!-- DataTables CSS -->
  <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet">
  <link href="css/admin-modern.css" rel="stylesheet">
  <link href="css/datatable-custom.css" rel="stylesheet">
</head>
<body>

  <!-- Sidebar -->
  <aside class="modern-sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="fas fa-mountain"></i></div>
      <div class="brand-text"><h3>Palabıyık</h3><p>Admin Panel</p></div>
    </div>
    <nav class="sidebar-menu">
      <a href="dashboard.html" class="menu-item"><div class="menu-icon"><i class="fas fa-chart-line"></i></div><span>Dashboard</span></a>
      <a href="haberler.html" class="menu-item active"><div class="menu-icon"><i class="fas fa-newspaper"></i></div><span>Haberler</span><span class="badge badge-primary">127</span></a>
      <a href="etkinlikler.html" class="menu-item"><div class="menu-icon"><i class="fas fa-calendar-alt"></i></div><span>Etkinlikler</span><span class="badge badge-success">48</span></a>
      <a href="esnaflar.html" class="menu-item"><div class="menu-icon"><i class="fas fa-store"></i></div><span>Esnaflar</span><span class="badge badge-warning">24</span></a>
      <a href="galeri.html" class="menu-item"><div class="menu-icon"><i class="fas fa-images"></i></div><span>Galeri</span></a>
      <a href="uyeler.html" class="menu-item"><div class="menu-icon"><i class="fas fa-users"></i></div><span>Üyeler</span><span class="badge badge-info">450</span></a>
      <a href="ayarlar.html" class="menu-item"><div class="menu-icon"><i class="fas fa-cog"></i></div><span>Ayarlar</span></a>
    </nav>
    <div class="sidebar-user">
      <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=100&q=80" alt="Admin">
      <div class="user-info"><strong>Admin</strong><small>Yönetici</small></div>
      <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-wrapper">
    <header class="top-bar">
      <div class="page-title"><h1>Haberler</h1><p>Tüm haberlerinizi yönetin</p></div>
      <div class="top-bar-actions">
        <button class="action-btn" title="Bildirimler"><i class="fas fa-bell"></i><span class="notification-dot"></span></button>
        <button class="action-btn" title="Mesajlar"><i class="fas fa-envelope"></i></button>
        <a href="haber-duzenle.html" class="btn btn-primary modern-btn"><i class="fas fa-plus me-2"></i><span>Yeni Haber Ekle</span></a>
      </div>
    </header>

    <div class="content-wrapper">
      
      <!-- Advanced Filters -->
      <div class="glass-card mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-center">
            <div class="col-md-3">
              <select class="form-select" id="filterCategory">
                <option value="">Tüm Kategoriler</option>
                <option value="altyapi">Altyapı</option>
                <option value="egitim">Eğitim</option>
                <option value="etkinlik">Etkinlik</option>
                <option value="duyuru">Duyuru</option>
                <option value="kultur">Kültür</option>
              </select>
            </div>
            <div class="col-md-3">
              <select class="form-select" id="filterStatus">
                <option value="">Tüm Durumlar</option>
                <option value="published">Yayınlandı</option>
                <option value="draft">Taslak</option>
                <option value="archived">Arşiv</option>
              </select>
            </div>
            <div class="col-md-3">
              <select class="form-select" id="filterAuthor">
                <option value="">Tüm Yazarlar</option>
                <option value="1">Ahmet Yılmaz</option>
                <option value="2">Hasan Koç</option>
                <option value="3">Mehmet Kaya</option>
              </select>
            </div>
            <div class="col-md-3">
              <button class="btn btn-secondary w-100" id="btnFilter">
                <i class="fas fa-filter me-2"></i>Filtrele
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- DataTable -->
      <div class="glass-card">
        <div class="card-header">
          <h4><i class="fas fa-list me-2"></i>Tüm Haberler</h4>
          <div class="card-actions">
            <button class="btn-action" id="btnExport">
              <i class="fas fa-download me-2"></i>Dışa Aktar
            </button>
            <button class="btn-action" id="btnRefresh">
              <i class="fas fa-sync-alt me-2"></i>Yenile
            </button>
          </div>
        </div>
        <div class="card-body">
          <table id="newsTable" class="table table-hover" style="width:100%">
            <thead>
              <tr>
                <th width="50">
                  <input type="checkbox" class="form-check-input" id="selectAll">
                </th>
                <th>Başlık</th>
                <th>Kategori</th>
                <th>Yazar</th>
                <th>Tarih</th>
                <th>Görüntüleme</th>
                <th>Durum</th>
                <th width="120">İşlemler</th>
              </tr>
            </thead>
            <tbody>
              <!-- DataTables will populate this -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/datatables/news-datatable.js"></script>
</body>
</html>
