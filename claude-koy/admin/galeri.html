<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri - Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="css/admin-modern.css" rel="stylesheet">
  <style>
    .gallery-item { position: relative; border-radius: 16px; overflow: hidden; cursor: pointer; transition: all 0.3s; }
    .gallery-item:hover { transform: scale(1.05); box-shadow: 0 12px 30px rgba(0,0,0,0.2); }
    .gallery-item img { width: 100%; height: 250px; object-fit: cover; }
    .gallery-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s; display: flex; align-items: center; justify-content: center; gap: 1rem; }
    .gallery-item:hover .gallery-overlay { opacity: 1; }
  </style>
</head>
<body>
  <aside class="modern-sidebar">
    <div class="sidebar-brand"><div class="brand-icon"><i class="fas fa-mountain"></i></div><div class="brand-text"><h3>Palabıyık</h3><p>Admin Panel</p></div></div>
    <nav class="sidebar-menu">
      <a href="dashboard.html" class="menu-item"><div class="menu-icon"><i class="fas fa-chart-line"></i></div><span>Dashboard</span></a>
      <a href="haberler.html" class="menu-item"><div class="menu-icon"><i class="fas fa-newspaper"></i></div><span>Haberler</span><span class="badge badge-primary">12</span></a>
      <a href="etkinlikler.html" class="menu-item"><div class="menu-icon"><i class="fas fa-calendar-alt"></i></div><span>Etkinlikler</span><span class="badge badge-success">8</span></a>
      <a href="esnaflar.html" class="menu-item"><div class="menu-icon"><i class="fas fa-store"></i></div><span>Esnaflar</span><span class="badge badge-warning">24</span></a>
      <a href="galeri.html" class="menu-item active"><div class="menu-icon"><i class="fas fa-images"></i></div><span>Galeri</span></a>
      <a href="uyeler.html" class="menu-item"><div class="menu-icon"><i class="fas fa-users"></i></div><span>Üyeler</span><span class="badge badge-info">450</span></a>
      <a href="ayarlar.html" class="menu-item"><div class="menu-icon"><i class="fas fa-cog"></i></div><span>Ayarlar</span></a>
    </nav>
    <div class="sidebar-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=100&q=80" alt="Admin"><div class="user-info"><strong>Admin</strong><small>Yönetici</small></div><button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button></div>
  </aside>

  <main class="main-wrapper">
    <header class="top-bar">
      <div class="page-title"><h1>Galeri Yönetimi</h1><p>Fotoğrafları yönetin</p></div>
      <div class="top-bar-actions">
        <button class="btn btn-primary modern-btn"><i class="fas fa-upload me-2"></i><span>Fotoğraf Yükle</span></button>
      </div>
    </header>

    <div class="content-wrapper">
      <div class="glass-card mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4"><input type="text" class="form-control" placeholder="Fotoğraf ara..."></div>
            <div class="col-md-3"><select class="form-select"><option>Tüm Kategoriler</option><option>Doğa</option><option>Etkinlikler</option><option>Yapılar</option></select></div>
            <div class="col-md-3"><select class="form-select"><option>Tarihe Göre</option><option>En Yeni</option><option>En Eski</option></select></div>
            <div class="col-md-2"><button class="btn btn-secondary w-100"><i class="fas fa-filter me-2"></i>Filtrele</button></div>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-md-4 col-lg-3">
          <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=400&q=80" alt="">
            <div class="gallery-overlay">
              <button class="btn btn-light btn-sm"><i class="fas fa-edit"></i></button>
              <button class="btn btn-danger btn-sm"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        </div>
        <div class="col-md-4 col-lg-3">
          <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=400&q=80" alt="">
            <div class="gallery-overlay">
              <button class="btn btn-light btn-sm"><i class="fas fa-edit"></i></button>
              <button class="btn btn-danger btn-sm"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        </div>
        <div class="col-md-4 col-lg-3">
          <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=400&q=80" alt="">
            <div class="gallery-overlay">
              <button class="btn btn-light btn-sm"><i class="fas fa-edit"></i></button>
              <button class="btn btn-danger btn-sm"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        </div>
        <div class="col-md-4 col-lg-3">
          <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=400&q=80" alt="">
            <div class="gallery-overlay">
              <button class="btn btn-light btn-sm"><i class="fas fa-edit"></i></button>
              <button class="btn btn-danger btn-sm"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin-common.js"></script>
</body>
</html>
