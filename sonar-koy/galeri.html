<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri | Palabıyık Köyü</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand brand-badge" href="index.html"><i class="fa-solid fa-leaf"></i><span>SONAR KÖY</span><span class="text-success">Palabıyık</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
          <li class="nav-item"><a class="nav-link" href="hakkimizda.html">Hakkımızda</a></li>
          <li class="nav-item"><a class="nav-link" href="haberler.html">Haberler</a></li>
          <li class="nav-item"><a class="nav-link" href="etkinlikler.html">Etkinlikler</a></li>
          <li class="nav-item"><a class="nav-link" href="galeri.html">Galeri</a></li>
          <li class="nav-item"><a class="nav-link" href="iletisim.html">İletişim</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero py-5">
    <div class="container">
      <div class="hero-card p-4 p-md-5">
        <h1 class="section-title mb-2">Foto Galeri</h1>
        <p class="section-sub mb-0">Kategorilere göre seçilmiş fotoğraflar; tıklayın, büyük görüntüleyin.</p>
      </div>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="d-flex flex-wrap gap-2 mb-4">
        <span class="badge text-bg-success-subtle border border-success-subtle text-success">Doğa</span>
        <span class="badge text-bg-warning-subtle border border-warning-subtle text-warning">Köy Yaşamı</span>
        <span class="badge text-bg-primary-subtle border border-primary-subtle text-primary">Mevsimler</span>
      </div>

      <div class="row g-4">
        <div class="col-sm-6 col-lg-4">
          <img class="gallery-img" data-lightbox data-title="Doğa" data-full="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1800&q=80" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80" alt="Orman" data-bs-toggle="modal" data-bs-target="#imgModal" />
        </div>
        <div class="col-sm-6 col-lg-4">
          <img class="gallery-img" data-lightbox data-title="Mevsimler" data-full="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1800&q=80" src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1200&q=80" alt="Yeşil" data-bs-toggle="modal" data-bs-target="#imgModal" />
        </div>
        <div class="col-sm-6 col-lg-4">
          <img class="gallery-img" data-lightbox data-title="Tarlalar" data-full="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1800&q=80" src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=80" alt="Tarla" data-bs-toggle="modal" data-bs-target="#imgModal" />
        </div>
        <div class="col-sm-6 col-lg-4">
          <img class="gallery-img" data-lightbox data-title="Köy Yaşamı" data-full="https://images.unsplash.com/photo-1523413651479-597eb2da0ad6?auto=format&fit=crop&w=1800&q=80" src="https://images.unsplash.com/photo-1523413651479-597eb2da0ad6?auto=format&fit=crop&w=1200&q=80" alt="Yaşam" data-bs-toggle="modal" data-bs-target="#imgModal" />
        </div>
        <div class="col-sm-6 col-lg-4">
          <img class="gallery-img" data-lightbox data-title="Dağlar" data-full="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1800&q=80" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80" alt="Dağ" data-bs-toggle="modal" data-bs-target="#imgModal" />
        </div>
        <div class="col-sm-6 col-lg-4">
          <img class="gallery-img" data-lightbox data-title="Gün Batımı" data-full="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1800&q=80" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80" alt="Gün batımı" data-bs-toggle="modal" data-bs-target="#imgModal" />
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Lightbox -->
  <div class="modal fade" id="imgModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content" style="border-radius:1rem; overflow:hidden;">
        <div class="modal-header">
          <h5 class="modal-title" data-modal-title style="font-weight:800;">Palabıyık Köyü</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
        </div>
        <div class="modal-body p-0">
          <img src="" alt="" style="width:100%; height:auto; display:block;" />
        </div>
      </div>
    </div>
  </div>

  <footer class="footer py-5">
    <div class="container"><div class="mini">© <span data-year></span> Palabıyık Köyü</div></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
