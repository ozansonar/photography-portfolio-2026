        <div class="container">

                <div class="col-lg-8 mb-4">

                        <h3 class="mb-4">Mesaj Gönderin</h3>
                        <form id="contactForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Adınız Soyadınız *</label>
                                    <input type="text" class="form-control" required>
