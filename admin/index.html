<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Photography Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="extended-styles.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-icon">📸</div>
                <div class="brand-text">
                    <h3>ADMIN</h3>
                    <p>Photography Panel</p>
                </div>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle"><i class="bi bi-x-lg"></i></button>
        </div>

        <div class="user-card">
            <img src="https://i.pravatar.cc/100?img=12" alt="Admin" class="user-avatar">
            <div class="user-info">
                <h4>Ozan SONAR</h4>
                <p><i class="bi bi-circle-fill text-success"></i> Online</p>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#dashboard" class="nav-link active" data-page="dashboard">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
            <a href="#gallery" class="nav-link" data-page="gallery">
                <i class="bi bi-images"></i>
                <span>Galeri Yönetimi</span>
                <span class="badge">24</span>
            </a>
            <a href="#blog" class="nav-link" data-page="blog">
                <i class="bi bi-file-text"></i>
                <span>Blog Yönetimi</span>
                <span class="badge">6</span>
            </a>
            <a href="#users" class="nav-link" data-page="users">
                <i class="bi bi-people"></i>
                <span>Kullanıcılar</span>
            </a>
            <a href="#messages" class="nav-link" data-page="messages">
                <i class="bi bi-envelope"></i>
                <span>Mesajlar</span>
                <span class="badge badge-danger">3</span>
            </a>
            <a href="#analytics" class="nav-link" data-page="analytics">
                <i class="bi bi-graph-up"></i>
                <span>Analitik</span>
            </a>
            <a href="#settings" class="nav-link" data-page="settings">
                <i class="bi bi-gear"></i>
                <span>Ayarlar</span>
            </a>
            <div class="nav-divider"></div>
            <a href="../index.html" class="nav-link">
                <i class="bi bi-box-arrow-left"></i>
                <span>Siteye Dön</span>
            </a>
            <a href="#logout" class="nav-link text-danger">
                <i class="bi bi-power"></i>
                <span>Çıkış Yap</span>
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Topbar -->
        <div class="topbar">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="bi bi-list"></i>
            </button>
            <div class="topbar-search">
                <i class="bi bi-search"></i>
                <input type="text" placeholder="Ara...">
            </div>
            <div class="topbar-actions">
                <button class="topbar-btn" id="themeToggle" title="Tema Değiştir">
                    <i class="bi bi-sun-fill"></i>
                </button>
                <button class="topbar-btn" title="Bildirimler">
                    <i class="bi bi-bell"></i>
                    <span class="notification-dot"></span>
                </button>
                <button class="topbar-btn" title="Tam Ekran">
                    <i class="bi bi-arrows-fullscreen"></i>
                </button>
            </div>
        </div>

        <!-- Dashboard Page (from original file) -->
        <div class="page-content active" id="dashboard">
            <!-- Dashboard content stays the same -->
        </div>

        <!-- Gallery Page (from original file) -->
        <div class="page-content" id="gallery">
            <!-- Gallery content stays the same -->
        </div>

        <!-- Load new pages from pages.html -->
        <div id="dynamicPages"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="admin-script.js"></script>
    <script src="extended-script.js"></script>
    <script>
        // Load dynamic pages
        fetch('pages.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('dynamicPages').innerHTML = html;
                // Re-initialize counters for new pages
                document.querySelectorAll('.counter').forEach(counter => {
                    if (counter.textContent === '0') {
                        const target = parseInt(counter.getAttribute('data-count'));
                        const duration = 2000;
                        const increment = target / (duration / 16);
                        let current = 0;
                        const timer = setInterval(() => {
                            current += increment;
                            if (current >= target) {
                                counter.textContent = target.toLocaleString();
                                clearInterval(timer);
                            } else {
                                counter.textContent = Math.floor(current).toLocaleString();
                            }
                        }, 16);
                    }
                });
            });
    </script>
</body>
</html>
