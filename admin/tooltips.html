<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Tooltips</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="bi bi-bootstrap-fill"></i><span>Modern 2026</span></div>
        <nav class="nav-menu"><a href="index.html" class="nav-item"><i class="bi bi-house-door"></i> Dashboard</a><div class="nav-section">Components</div><a href="tooltips.html" class="nav-item active"><i class="bi bi-info-circle"></i> Tooltips</a><a href="buttons.html" class="nav-item"><i class="bi bi-hand-index"></i> Buttons</a></nav>
    </div>
    <div class="main-content">
        <div class="header"><h1><i class="bi bi-info-circle"></i> Advanced Tooltips</h1><p>12 Professional Tooltip Styles</p></div>
        <div class="demo-section"><h3>1. Directional Tooltips</h3>
            <button class="btn btn-primary me-2" data-bs-toggle="tooltip" data-bs-placement="top" title="Top tooltip">Top</button>
            <button class="btn btn-secondary me-2" data-bs-toggle="tooltip" data-bs-placement="right" title="Right tooltip">Right</button>
            <button class="btn btn-success me-2" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Bottom tooltip">Bottom</button>
            <button class="btn btn-danger me-2" data-bs-toggle="tooltip" data-bs-placement="left" title="Left tooltip">Left</button>
        </div>
        <div class="demo-section"><h3>2. Icon Tooltips</h3>
            <button class="btn btn-outline-primary me-2" data-bs-toggle="tooltip" title="Save your work"><i class="bi bi-save"></i></button>
            <button class="btn btn-outline-secondary me-2" data-bs-toggle="tooltip" title="Edit content"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-outline-danger me-2" data-bs-toggle="tooltip" title="Delete item"><i class="bi bi-trash"></i></button>
            <button class="btn btn-outline-success me-2" data-bs-toggle="tooltip" title="Share with others"><i class="bi bi-share"></i></button>
        </div>
        <div class="demo-section"><h3>3. HTML Tooltips</h3>
            <button class="btn btn-info" data-bs-toggle="tooltip" data-bs-html="true" title="<strong>Bold text</strong><br><em>Italic text</em>">HTML Content</button>
        </div>
        <div class="demo-section"><h3>4. Text with Tooltips</h3>
            <p>Hover over <span data-bs-toggle="tooltip" title="This is important!" style="color:#6366F1;cursor:help;text-decoration:underline">this highlighted text</span> to see the tooltip.</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>const tooltipTriggerList=document.querySelectorAll('[data-bs-toggle="tooltip"]');[...tooltipTriggerList].map(el=>new bootstrap.Tooltip(el));</script>
</body>
</html>
