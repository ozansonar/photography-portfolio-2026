<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Button Groups</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="bi bi-bootstrap-fill"></i><span>Modern 2026</span></div>
        <nav class="nav-menu"><a href="index.html" class="nav-item"><i class="bi bi-house-door"></i> Dashboard</a><div class="nav-section">Components</div><a href="button-group.html" class="nav-item active"><i class="bi bi-collection"></i> Button Group</a><a href="buttons.html" class="nav-item"><i class="bi bi-hand-index"></i> Buttons</a></nav>
    </div>
    <div class="main-content">
        <div class="header"><h1><i class="bi bi-collection"></i> Advanced Button Groups</h1><p>12 Professional Button Group Styles</p></div>
        <div class="demo-section"><h3>1. Basic Button Groups</h3>
            <div class="btn-group" role="group"><button class="btn btn-primary">Left</button><button class="btn btn-primary">Middle</button><button class="btn btn-primary">Right</button></div>
        </div>
        <div class="demo-section"><h3>2. Icon Button Groups</h3>
            <div class="btn-group" role="group"><button class="btn btn-secondary"><i class="bi bi-text-left"></i></button><button class="btn btn-secondary"><i class="bi bi-text-center"></i></button><button class="btn btn-secondary"><i class="bi bi-text-right"></i></button></div>
        </div>
        <div class="demo-section"><h3>3. Toolbar</h3>
            <div class="btn-toolbar" role="toolbar"><div class="btn-group me-2"><button class="btn btn-primary"><i class="bi bi-type-bold"></i></button><button class="btn btn-primary"><i class="bi bi-type-italic"></i></button><button class="btn btn-primary"><i class="bi bi-type-underline"></i></button></div><div class="btn-group me-2"><button class="btn btn-secondary"><i class="bi bi-list-ul"></i></button><button class="btn btn-secondary"><i class="bi bi-list-ol"></i></button></div></div>
        </div>
        <div class="demo-section"><h3>4. Vertical Button Group</h3>
            <div class="btn-group-vertical"><button class="btn btn-success"><i class="bi bi-house me-2"></i>Home</button><button class="btn btn-success"><i class="bi bi-gear me-2"></i>Settings</button><button class="btn btn-success"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></div>
        </div>
        <div class="demo-section"><h3>5. Radio Button Group</h3>
            <div class="btn-group" role="group"><input type="radio" class="btn-check" name="options" id="opt1" checked><label class="btn btn-outline-primary" for="opt1">Option 1</label><input type="radio" class="btn-check" name="options" id="opt2"><label class="btn btn-outline-primary" for="opt2">Option 2</label><input type="radio" class="btn-check" name="options" id="opt3"><label class="btn btn-outline-primary" for="opt3">Option 3</label></div>
        </div>
        <div class="demo-section"><h3>6. Size Variations</h3>
            <div class="btn-group btn-group-lg mb-3"><button class="btn btn-primary">Large</button><button class="btn btn-primary">Group</button></div><br>
            <div class="btn-group mb-3"><button class="btn btn-secondary">Default</button><button class="btn btn-secondary">Group</button></div><br>
            <div class="btn-group btn-group-sm"><button class="btn btn-success">Small</button><button class="btn btn-success">Group</button></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
