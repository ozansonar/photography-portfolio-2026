<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Spinners</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .spinner-gradient{border-top-color:#6366F1;border-right-color:#EC4899;border-bottom-color:#10B981;border-left-color:#F59E0B}
        @keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(99,102,241,0.7)}100%{box-shadow:0 0 0 20px rgba(99,102,241,0)}}
        .spinner-pulse{width:3rem;height:3rem;border-radius:50%;background:#6366F1;animation:pulse-ring 1.5s ease-out infinite}
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="bi bi-bootstrap-fill"></i><span>Modern 2026</span></div>
        <nav class="nav-menu"><a href="index.html" class="nav-item"><i class="bi bi-house-door"></i> Dashboard</a><div class="nav-section">Components</div><a href="spinners.html" class="nav-item active"><i class="bi bi-arrow-repeat"></i> Spinners</a><a href="buttons.html" class="nav-item"><i class="bi bi-hand-index"></i> Buttons</a></nav>
    </div>
    <div class="main-content">
        <div class="header"><h1><i class="bi bi-arrow-repeat"></i> Advanced Spinners</h1><p>12 Professional Loading Animations</p></div>
        <div class="demo-section"><h3>1. Border Spinners</h3>
            <div class="spinner-border text-primary me-3"></div>
            <div class="spinner-border text-secondary me-3"></div>
            <div class="spinner-border text-success me-3"></div>
            <div class="spinner-border text-danger me-3"></div>
            <div class="spinner-border text-warning me-3"></div>
            <div class="spinner-border text-info me-3"></div>
        </div>
        <div class="demo-section"><h3>2. Growing Spinners</h3>
            <div class="spinner-grow text-primary me-3"></div>
            <div class="spinner-grow text-secondary me-3"></div>
            <div class="spinner-grow text-success me-3"></div>
            <div class="spinner-grow text-danger me-3"></div>
        </div>
        <div class="demo-section"><h3>3. Gradient Spinner</h3>
            <div class="spinner-border spinner-gradient" style="width:3rem;height:3rem"></div>
        </div>
        <div class="demo-section"><h3>4. Pulse Spinner</h3>
            <div class="spinner-pulse"></div>
        </div>
        <div class="demo-section"><h3>5. Button Spinners</h3>
            <button class="btn btn-primary me-2" disabled><span class="spinner-border spinner-border-sm me-2"></span>Loading...</button>
            <button class="btn btn-success me-2" disabled><span class="spinner-grow spinner-grow-sm me-2"></span>Processing...</button>
        </div>
        <div class="demo-section"><h3>6. Size Variations</h3>
            <div class="spinner-border spinner-border-sm text-primary me-3"></div>
            <div class="spinner-border text-primary me-3"></div>
            <div class="spinner-border text-primary me-3" style="width:3rem;height:3rem"></div>
            <div class="spinner-border text-primary" style="width:4rem;height:4rem"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
