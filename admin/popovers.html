<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Popovers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="bi bi-bootstrap-fill"></i><span>Modern 2026</span></div>
        <nav class="nav-menu"><a href="index.html" class="nav-item"><i class="bi bi-house-door"></i> Dashboard</a><div class="nav-section">Components</div><a href="popovers.html" class="nav-item active"><i class="bi bi-chat-square"></i> Popovers</a><a href="buttons.html" class="nav-item"><i class="bi bi-hand-index"></i> Buttons</a></nav>
    </div>
    <div class="main-content">
        <div class="header"><h1><i class="bi bi-chat-square"></i> Advanced Popovers</h1><p>12 Professional Popover Styles</p></div>
        <div class="demo-section"><h3>1. Directional Popovers</h3>
            <button class="btn btn-primary me-2" data-bs-toggle="popover" data-bs-placement="top" data-bs-title="Top Popover" data-bs-content="This popover appears on top.">Top</button>
            <button class="btn btn-secondary me-2" data-bs-toggle="popover" data-bs-placement="right" data-bs-title="Right Popover" data-bs-content="This popover appears on the right.">Right</button>
            <button class="btn btn-success me-2" data-bs-toggle="popover" data-bs-placement="bottom" data-bs-title="Bottom Popover" data-bs-content="This popover appears on bottom.">Bottom</button>
            <button class="btn btn-danger me-2" data-bs-toggle="popover" data-bs-placement="left" data-bs-title="Left Popover" data-bs-content="This popover appears on the left.">Left</button>
        </div>
        <div class="demo-section"><h3>2. Dismiss on Next Click</h3>
            <button class="btn btn-info" data-bs-toggle="popover" data-bs-trigger="focus" data-bs-title="Dismissible" data-bs-content="Click anywhere to dismiss this popover.">Dismissible Popover</button>
        </div>
        <div class="demo-section"><h3>3. HTML Content Popover</h3>
            <button class="btn btn-warning" data-bs-toggle="popover" data-bs-html="true" data-bs-title="<strong>Rich Content</strong>" data-bs-content="<p>This popover contains <em>HTML</em> content!</p><ul><li>Item 1</li><li>Item 2</li></ul>">HTML Popover</button>
        </div>
        <div class="demo-section"><h3>4. Custom Icon Popover</h3>
            <button class="btn btn-outline-primary" data-bs-toggle="popover" data-bs-title="<i class='bi bi-info-circle'></i> Information" data-bs-html="true" data-bs-content="Additional information about this feature."><i class="bi bi-question-circle"></i></button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>const popoverTriggerList=document.querySelectorAll('[data-bs-toggle="popover"]');[...popoverTriggerList].map(el=>new bootstrap.Popover(el));</script>
</body>
</html>
