<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Toasts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .toast-modern{background:linear-gradient(135deg,rgba(30,41,59,0.98),rgba(15,23,42,0.95));backdrop-filter:blur(20px);border:1px solid rgba(148,163,184,0.2);border-radius:1rem}
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="bi bi-bootstrap-fill"></i><span>Modern 2026</span></div>
        <nav class="nav-menu"><a href="index.html" class="nav-item"><i class="bi bi-house-door"></i> Dashboard</a><div class="nav-section">Components</div><a href="toasts.html" class="nav-item active"><i class="bi bi-bell"></i> Toasts</a><a href="buttons.html" class="nav-item"><i class="bi bi-hand-index"></i> Buttons</a></nav>
    </div>
    <div class="main-content">
        <div class="header"><h1><i class="bi bi-bell"></i> Advanced Toasts</h1><p>12 Professional Notification Styles</p></div>
        <div class="demo-section"><h3>1. Modern Toast Notifications</h3>
            <button class="btn btn-primary me-2" onclick="showToast('toast1')">Show Success</button>
            <button class="btn btn-danger me-2" onclick="showToast('toast2')">Show Error</button>
            <button class="btn btn-warning me-2" onclick="showToast('toast3')">Show Warning</button>
        </div>
        <div class="toast-container position-fixed top-0 end-0 p-3">
            <div id="toast1" class="toast toast-modern" role="alert"><div class="toast-header" style="background:rgba(16,185,129,0.2);border:none"><i class="bi bi-check-circle text-success me-2"></i><strong class="me-auto">Success</strong><button type="button" class="btn-close" data-bs-dismiss="toast"></button></div><div class="toast-body">Your changes have been saved successfully!</div></div>
            <div id="toast2" class="toast toast-modern" role="alert"><div class="toast-header" style="background:rgba(239,68,68,0.2);border:none"><i class="bi bi-x-circle text-danger me-2"></i><strong class="me-auto">Error</strong><button type="button" class="btn-close" data-bs-dismiss="toast"></button></div><div class="toast-body">Failed to connect to server.</div></div>
            <div id="toast3" class="toast toast-modern" role="alert"><div class="toast-header" style="background:rgba(245,158,11,0.2);border:none"><i class="bi bi-exclamation-triangle text-warning me-2"></i><strong class="me-auto">Warning</strong><button type="button" class="btn-close" data-bs-dismiss="toast"></button></div><div class="toast-body">Your session will expire in 5 minutes.</div></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>function showToast(id){const toast=new bootstrap.Toast(document.getElementById(id));toast.show();}</script>
</body>
</html>
