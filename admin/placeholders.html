<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Placeholders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>.placeholder-modern{background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(236,72,153,0.2));animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.8}50%{opacity:.4}}</style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="bi bi-bootstrap-fill"></i><span>Modern 2026</span></div>
        <nav class="nav-menu"><a href="index.html" class="nav-item"><i class="bi bi-house-door"></i> Dashboard</a><div class="nav-section">Components</div><a href="placeholders.html" class="nav-item active"><i class="bi bi-dash-square"></i> Placeholders</a><a href="buttons.html" class="nav-item"><i class="bi bi-hand-index"></i> Buttons</a></nav>
    </div>
    <div class="main-content">
        <div class="header"><h1><i class="bi bi-dash-square"></i> Advanced Placeholders</h1><p>12 Professional Skeleton Loaders</p></div>
        <div class="demo-section"><h3>1. Basic Placeholders</h3>
            <div class="card glass-effect"><div class="card-body"><h5 class="card-title placeholder-glow"><span class="placeholder col-6"></span></h5><p class="card-text placeholder-glow"><span class="placeholder col-7"></span><span class="placeholder col-4"></span><span class="placeholder col-4"></span><span class="placeholder col-6"></span><span class="placeholder col-8"></span></p><a class="btn btn-primary disabled placeholder col-6"></a></div></div>
        </div>
        <div class="demo-section"><h3>2. Gradient Placeholders</h3>
            <div class="card glass-effect"><div class="card-body"><div class="placeholder-glow"><span class="placeholder placeholder-modern col-12 mb-2" style="height:200px"></span><span class="placeholder placeholder-modern col-8"></span><span class="placeholder placeholder-modern col-6 mt-2"></span></div></div></div>
        </div>
        <div class="demo-section"><h3>3. Size Variations</h3>
            <span class="placeholder col-12 placeholder-lg mb-2"></span>
            <span class="placeholder col-12 mb-2"></span>
            <span class="placeholder col-12 placeholder-sm mb-2"></span>
            <span class="placeholder col-12 placeholder-xs"></span>
        </div>
        <div class="demo-section"><h3>4. Wave Animation</h3>
            <div class="card glass-effect"><div class="card-body"><p class="placeholder-wave"><span class="placeholder col-12"></span><span class="placeholder col-10"></span><span class="placeholder col-8"></span><span class="placeholder col-6"></span></p></div></div>
        </div>
        <div class="demo-section"><h3>5. Profile Skeleton</h3>
            <div class="card glass-effect"><div class="card-body"><div class="d-flex align-items-center"><div class="placeholder-glow me-3"><span class="placeholder" style="width:80px;height:80px;border-radius:50%;display:block"></span></div><div class="flex-grow-1 placeholder-glow"><span class="placeholder col-6 mb-2"></span><span class="placeholder col-4"></span></div></div></div></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
